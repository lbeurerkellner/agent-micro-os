[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fs"
version = "0.1.0"
description = "A simple, versioned vault for agents."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "docker>=7.1.0",
    "fusepy>=3.0.1",
    "litellm>=1.81.6",
    "openai>=2.16.0",
    "openai-agents>=0.7.0",
    "prompt-toolkit>=3.0.52",
    "pytest-asyncio>=1.3.0",
    "termcolor>=3.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.18",
    "structlog>=25.5.0",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["fs", "bin", "system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]

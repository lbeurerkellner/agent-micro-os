version: "3.8"

services:
  # serves each user's vault contents as a web app
  vault-web:
    build: .
    image: vault-web:latest
    hostname: vault-web
    container_name: vault-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./vault.db:/app/vault.db
      - ./passwd.txt:/app/passwd.txt:ro
    environment:
      - TZ=Europe/Berlin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vault-web.rule=Host(`vault.${PRIMARY_DOMAIN}`)"
      - "traefik.http.routers.vault-web.entrypoints=websecure"
      - "traefik.http.routers.vault-web.tls=true"
      - "traefik.http.routers.vault-web.tls.certresolver=le"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
